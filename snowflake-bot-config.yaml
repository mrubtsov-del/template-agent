apiVersion: v1
kind: ConfigMap
metadata:
  name: snowflake-bot-config
data:
  AGENT_HOST: "0.0.0.0"
  AGENT_PORT: "8081"
  PYTHON_LOG_LEVEL: "INFO"
  USE_INMEMORY_SAVER: "true"
  MCP_ENABLED: "false"
  SNOWFLAKE_QUERY_TIMEOUT: "60"
  SNOWFLAKE_MAX_ROWS: "1000"
  # Preprod: use SNOWFLAKE_* from secret when Shadowbot OAuth token is invalid.
  # Prod per-user OAuth: set to "false" and fix X-Authorization-Snowflake on platform.
  SNOWFLAKE_PREFER_ENV_CREDENTIALS: "true"
  SNOWFLAKE_OAUTH_FALLBACK_TO_ENV: "true"
  PLOT_ENABLED: "true"
  PLOT_MAX_ROWS: "5000"
  AGENT_PUBLIC_BASE_URL: "https://snowflake-bot-rhu-platforms--pipeline.apps.mpp-w2-preprod.cfln.p1.openshiftapps.com"
  LANGFUSE_TRACING_ENVIRONMENT: "production"
  # Shadowbot JWT (preprod: OAUTH_ISSUER→AUTH_ISSUER, JWKS_URL→AUTH_JWKS_URL — use stage EmployeeIDP)
  AUTH_ENABLED: "true"
  AUTH_AUDIENCE: "account"
  AUTH_ISSUER: "https://auth.stage.redhat.com/auth/realms/EmployeeIDP"
  AUTH_JWKS_URL: "https://auth.stage.redhat.com/auth/realms/EmployeeIDP/protocol/openid-connect/certs"
  AUTH_ALGORITHMS: "RS256"
  AUTH_VERIFY_EXP: "true"
  AUTH_VERIFY_AUD: "true"