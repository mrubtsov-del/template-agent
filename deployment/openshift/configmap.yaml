apiVersion: v1
kind: ConfigMap
metadata:
  name: template-agent-config
  labels:
    app: template-agent
    component: agent
data:
  PYTHON_LOG_LEVEL: "INFO"
  USE_INMEMORY_SAVER: "false"
  LANGFUSE_TRACING_ENVIRONMENT: "production"
  MCP_ENABLED: "false"
  MCP_SERVER_NAME: "template-mcp-server"
  MCP_SERVER_URL: "https://template-mcp-server.ns.svc:8443/mcp/"
  MCP_TRANSPORT_PROTOCOL: "streamable_http"
  MCP_CONNECTION_TIMEOUT: "30"
  MCP_SSL_VERIFY: "false"
  SNOWFLAKE_QUERY_TIMEOUT: "60"
  SNOWFLAKE_MAX_ROWS: "1000"
  SSO_CALLBACK_URL: ""
  # Shadowbot JWT (vendor reads AUTH_*). Prod EmployeeIDP; non-prod: auth.stage.redhat.com + matching JWKS.
  AUTH_ENABLED: "true"
  AUTH_AUDIENCE: "account"
  AUTH_ISSUER: "https://auth.redhat.com/auth/realms/EmployeeIDP"
  AUTH_JWKS_URL: "https://auth.redhat.com/auth/realms/EmployeeIDP/protocol/openid-connect/certs"
  AUTH_ALGORITHMS: "RS256"
  AUTH_VERIFY_EXP: "true"
  AUTH_VERIFY_AUD: "true"
